<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function() {
    var urlParams = new URLSearchParams(window.location.search);
    var urlLang = urlParams.get('lang');
    var storedLang = localStorage.getItem('sizo-lang');
    var lang = (urlLang && ['en','fr','ar'].includes(urlLang)) ? urlLang : (storedLang && ['en','fr','ar'].includes(storedLang) ? storedLang : 'en');
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  })();
  </script>
  <script>
  (function(){
    var t=localStorage.getItem('sizo-theme')||'dark';
    document.documentElement.setAttribute('data-theme',t);
    if(t==='dark')document.documentElement.classList.add('dark');
  })();
  </script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | SIZO Digital Store</title>
  <meta name="description" content="The page you're looking for doesn't exist. Search SIZO or explore popular digital gift cards, top-ups & game keys.">
  <meta name="robots" content="noindex,follow">
  <link rel="alternate" hreflang="en" href="https://sizo.uk/404.html?lang=en">
  <link rel="alternate" hreflang="fr" href="https://sizo.uk/404.html?lang=fr">
  <link rel="alternate" hreflang="ar" href="https://sizo.uk/404.html?lang=ar">
  <link rel="alternate" hreflang="x-default" href="https://sizo.uk/404.html">
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tailwind.css">
  <script defer src="/assets/js/vendor/lucide-0.475.0.min.js"></script>
</head>
<body class="font-body min-h-screen">
  <a href="#main-content" class="skip-link" data-i18n="skip_link">Skip to content</a>
  <header id="navbar-mount"></header>

  <main id="main-content" class="pt-28 pb-20">
    <section class="nf-hero">
      <p class="font-mono text-xs uppercase tracking-[0.15em] text-coral" data-i18n="error_404">Error 404</p>
      <h1 class="font-display text-7xl sm:text-8xl font-black text-[var(--text-primary)] mt-4" data-anim="slide-right" data-anim-delay="1" data-i18n="lost_title">LOST?</h1>
      <div class="hero-ornament mt-6 mb-6 mx-auto" style="width:64px;height:3px;background:linear-gradient(90deg,var(--cyan),var(--coral))" data-anim="fade-up" data-anim-delay="2"></div>
      <p class="text-lg text-[var(--muted)] max-w-md mx-auto leading-relaxed" data-anim="fade-up" data-anim-delay="2">
        This page doesn't exist — maybe it was never unlocked, or the key expired. Try a search, or pick up where our most-wanted list left off.
      </p>

      <form id="nf-search-form" class="nf-search mt-8" role="search" aria-label="" data-i18n="aria_search_store" data-anim="fade-up" data-anim-delay="3">
        <span class="nf-search__icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <label for="nf-search-input" class="sr-only" data-i18n="sr_search_store">Search the store</label>
        <input
          id="nf-search-input"
          type="search"
          name="search"
          class="nf-search__input"
          placeholder="Search games, gift cards, top-ups…" data-i18n-placeholder="search_placeholder_404"
          autocomplete="off"
          enterkeyhint="search"
        >
        <button type="submit" class="nf-search__submit" data-i18n="btn_search">Search</button>
      </form>

      <div class="mt-6 flex flex-wrap justify-center gap-3" data-anim="scale-in" data-anim-delay="4">
        <a href="index.html" class="btn btn-primary text-sm px-6 py-3">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          GO HOME
        </a>
        <a href="browse.html" class="btn btn-secondary text-sm px-6 py-3">
          BROWSE STORE
        </a>
      </div>
    </section>

    <section class="nf-popular" aria-labelledby="nf-popular-heading" data-anim="fade-up" data-anim-delay="4">
      <p class="nf-popular__eyebrow" data-i18n="most_wanted">Most Wanted</p>
      <h2 id="nf-popular-heading" class="nf-popular__title" data-i18n="popular_right_now">Popular Right Now</h2>
      <div id="nf-popular-grid" class="nf-popular__grid"></div>
    </section>
  </main>

  <footer id="footer-mount"></footer>

  <script type="module" src="/assets/js/core/components.js"></script>
  <script type="module" src="/assets/js/pages/not-found.js"></script>
</body>
</html>
