<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function() {
    var urlParams = new URLSearchParams(window.location.search);
    var urlLang = urlParams.get('lang');
    var storedLang = localStorage.getItem('sizo-lang');
    var lang = (urlLang && ['en','fr','ar'].includes(urlLang)) ? urlLang : (storedLang && ['en','fr','ar'].includes(storedLang) ? storedLang : 'en');
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  })();
  </script>
  <script>
  (function(){
    var t=localStorage.getItem('sizo-theme')||'dark';
    document.documentElement.setAttribute('data-theme',t);
    if(t==='dark')document.documentElement.classList.add('dark');
  })();
  </script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | SIZO Digital Store</title>
  <meta name="description" content="Review your game key selections before checkout.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Orbitron:wght@700;800;900&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <script defer src="assets/js/vendor/lucide-0.475.0.min.js"></script>

</head>
<body class="font-body">
  <a href="#main-content" class="skip-link" data-i18n="skip_link">Skip to content</a>
  <header id="navbar-mount"></header>

  <main id="main-content" class="cart-page container">
    <div id="cart-status" aria-live="polite" aria-atomic="true" class="sr-only"></div>
    <h1 class="page-title" data-anim="fade-up" data-i18n="cart_title">Your Cart</h1>
    <div class="cart-layout">
      <div class="cart-items-section" data-anim="slide-left" data-anim-delay="2">
        <div id="cart-items" class="cart-items"></div>

        <div id="empty-cart" class="empty-cart hidden">
          <svg class="empty-cart__icon" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <h2 class="empty-cart__title" data-i18n="cart_empty_title">Your cart is empty</h2>
          <p class="empty-cart__desc" data-i18n="cart_empty_desc">Browse games and add items to continue.</p>
          <a href="browse.html" class="empty-cart__cta" data-i18n="btn_continue_shopping">Continue Shopping</a>
        </div>

        <div id="cart-actions-row" class="cart-actions">
          <a href="browse.html" data-i18n="btn_continue_shopping">Continue Shopping</a>
          <button id="clear-cart" data-i18n="btn_clear">Clear Cart</button>
        </div>
      </div>

      <div class="order-summary" data-anim="slide-right" data-anim-delay="1">
        <h2 class="order-summary__title" data-i18n="cart_order_summary">Order Summary</h2>

        <div class="promo-row">
          <label for="cart-promo-code" class="sr-only" data-i18n="cart_promo_code">Promo Code</label>
          <input type="text" id="cart-promo-code" data-i18n-placeholder="cart_promo_placeholder" placeholder="Promo code" class="promo-input">
          <button id="cart-apply-promo" class="btn btn-secondary btn-sm" data-i18n="btn_apply">Apply</button>
        </div>
        <p id="cart-promo-message" class="promo-message"></p>
        <div id="cart-promo-applied" class="promo-applied hidden">
          <span class="promo-applied__code"><span id="cart-applied-code"></span></span>
          <button id="cart-remove-promo" class="promo-applied__remove" data-i18n="btn_remove">Remove</button>
        </div>

        <div class="summary-lines">
          <div class="summary-line">
            <span class="summary-line__label" data-i18n="cart_subtotal">Subtotal</span>
            <span class="summary-line__value" id="subtotal">0.00 DZD</span>
          </div>
          <div class="summary-line">
            <span class="summary-line__label" data-i18n="cart_savings">Store Savings</span>
            <span class="summary-line__value summary-line__value--success" id="discount">0.00 DZD</span>
          </div>
          <div class="summary-line">
            <span class="summary-line__label" data-i18n="cart_tax">Tax</span>
            <span class="summary-line__value" id="tax">0.00 DZD</span>
          </div>
        </div>

        <div class="summary-total">
          <span class="summary-total__label" data-i18n="cart_total">Total</span>
          <span class="summary-total__value" id="total" aria-live="polite">0.00 DZD</span>
        </div>

        <a href="checkout.html" id="checkout-btn" class="checkout-btn" data-i18n="btn_proceed_checkout">Proceed to Checkout</a>

        <div class="trust-signals">
          <div class="trust-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span data-i18n="cart_trust_secure">Secure checkout</span>
          </div>
          <div class="trust-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <span data-i18n="cart_trust_delivery">Instant delivery</span>
          </div>
          <div class="trust-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span data-i18n="cart_trust_codes">Official codes only</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer-mount"></footer>

  <script type="module" src="assets/js/core/components.js"></script>
  <script type="module" src="assets/js/pages/cart.js"></script>
</body>
</html>
