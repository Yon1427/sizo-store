<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function() {
    var urlParams = new URLSearchParams(window.location.search);
    var urlLang = urlParams.get('lang');
    var storedLang = localStorage.getItem('sizo-lang');
    var lang = (urlLang && ['en','fr','ar'].includes(urlLang)) ? urlLang : (storedLang && ['en','fr','ar'].includes(storedLang) ? storedLang : 'en');
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  })();
  </script>
  <script>
  (function(){
    var t=localStorage.getItem('sizo-theme')||'dark';
    document.documentElement.setAttribute('data-theme',t);
    if(t==='dark')document.documentElement.classList.add('dark');
  })();
  </script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | SIZO Digital Store</title>
  <meta name="description" content="Sign in to your SIZO account to view orders, manage your library, and access purchased digital products.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="/assets/css/tailwind.css">
  <script defer src="/assets/js/vendor/lucide-0.475.0.min.js"></script>

  <!-- Shared CSS -->

</head>
<body class="font-body">
  <a href="#main-content" class="skip-link" data-i18n="skip_link">Skip to content</a>
  <header id="navbar-mount"></header>

  <main id="main-content" class="login-page">
    <div class="login-card" style="margin-top: 7rem; margin-bottom: 3rem;" data-anim="slide-right" data-anim-delay="1">
      <h1 class="login-card__title" data-i18n="login_title" data-anim="fade-up">SIGN IN</h1>
      <p class="login-card__subtitle" data-i18n="login_subtitle" data-anim="fade-up" data-anim-delay="1">Access your SIZO account.</p>

      <div class="social-btns">
        <button class="social-btn" id="google-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          <span data-i18n="social_google">Google</span>
        </button>
      </div>

      <div class="divider">
        <div class="divider__line"></div>
        <span class="divider__text" data-i18n="login_or">OR</span>
        <div class="divider__line"></div>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="login-form__row">
          <label for="email" class="login-form__label login-form__label--required" data-i18n="field_email">Email</label>
          <input type="email" id="email" class="login-form__input" required autocomplete="email" placeholder="you@example.com" data-i18n-placeholder="placeholder_email_example">
          <span id="email-error" class="field-error" hidden></span>
        </div>
        <div class="login-form__row">
          <label for="password" class="login-form__label login-form__label--required" data-i18n="field_password">Password</label>
          <div class="login-form__input-wrap">
            <input type="password" id="password" class="login-form__input login-form__input--password" required autocomplete="current-password" placeholder="••••••••">
            <button type="button" id="password-toggle" class="password-toggle" aria-label="Toggle password visibility" data-i18n-aria-label="aria_toggle_password">
              <i data-lucide="eye" class="w-5 h-5"></i>
            </button>
          </div>
          <span id="password-error" class="field-error" hidden></span>
        </div>
        <div class="login-form__forgot">
          <a href="/forgot-password.html" class="login-form__forgot-link" data-i18n="login_forgot">Forgot password?</a>
        </div>
        <div id="login-turnstile" class="login-form__turnstile"></div>
        <button type="submit" class="login-form__submit" id="submit-btn" data-i18n="btn_sign_in" data-anim="scale-in" data-anim-delay="2">SIGN IN</button>
      </form>

      <div class="login-card__footer">
        <p class="login-card__footer-text"><span data-i18n="login_no_account">Don't have an account?</span> <a href="/register.html" class="login-card__footer-link" data-i18n="login_create_one">Create one</a></p>
        <a href="/index.html" class="login-card__back" data-i18n="back_to_home">Back to Home</a>
      </div>
    </div>
  </main>

  <!-- Shared Components -->
  <footer id="footer-mount"></footer>

  <script type="module" src="/assets/js/core/components.js"></script>

  <!-- Page-specific script -->
  <script type="module" src="/assets/js/pages/login.js?v=20260602-auth-fix"></script>
</body>
</html>
