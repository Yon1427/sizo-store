<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function() {
    var urlParams = new URLSearchParams(window.location.search);
    var urlLang = urlParams.get('lang');
    var storedLang = localStorage.getItem('sizo-lang');
    var lang = (urlLang && ['en','fr','ar'].includes(urlLang)) ? urlLang : (storedLang && ['en','fr','ar'].includes(storedLang) ? storedLang : 'en');
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  })();
  </script>
  <script>
  (function(){
    var t=localStorage.getItem('sizo-theme')||'dark';
    document.documentElement.setAttribute('data-theme',t);
    if(t==='dark')document.documentElement.classList.add('dark');
  })();
  </script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email | SIZO Digital Store</title>
  <meta name="description" content="Verify your SIZO account email address.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Orbitron:wght@700;800;900&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <script defer src="assets/js/vendor/lucide-0.475.0.min.js"></script>
</head>
<body class="font-body">
  <a href="#main-content" class="skip-link" data-i18n="skip_link">Skip to content</a>
  <header id="navbar-mount"></header>

  <main id="main-content" class="mx-auto flex min-h-screen max-w-md items-center px-4 py-10 pt-28">
    <div style="border-color:var(--border)" class="w-full border rounded-2xl bg-[var(--surface)] p-8 text-center  dark:bg-[var(--surface)]" data-anim="slide-right" data-anim-delay="1">
      <p class="font-mono text-xs uppercase tracking-[0.3em] text-cyan" data-anim="fade-up" data-i18n="verify_subtitle">Account Security</p>
      <h1 style="color:var(--text-primary)" class="mt-3 font-display text-3xl font-black  " data-anim="fade-up" data-anim-delay="1" data-i18n="verify_title">VERIFY EMAIL</h1>
      <div id="verify-email-panel" class="mt-6 border   p-6  " style="background:var(--bg); border-color:var(--border)" >
        <div id="verify-email-icon" class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-cyan/15 text-cyan">
          <i data-lucide="loader-2" class="h-6 w-6 animate-spin"></i>
        </div>
        <p id="verify-email-title" style="color:var(--text-primary)" class="mt-4 font-display text-xl font-bold  " data-i18n="verify_checking">Checking your verification link...</p>
        <p id="verify-email-copy" class="mt-2 text-[var(--muted)]" data-i18n="verify_waiting">Please wait while we confirm your email address.</p>
      </div>
      <div class="mt-6 flex flex-wrap justify-center gap-3">
        <a id="verify-email-primary" href="login.html" class="btn-cyber bg-cyan px-5 py-3 font-display text-sm font-bold text-void" data-i18n="btn_go_to_sign_in">GO TO SIGN IN</a>
        <a href="profile.html?tab=settings" class="btn-cyber border  px-5 py-3 font-display text-sm font-bold   " style="color:var(--text-primary); border-color:var(--border)"  data-i18n="btn_account_settings">ACCOUNT SETTINGS</a>
      </div>
    </div>
  </main>

  <footer id="footer-mount"></footer>

  <script type="module" src="assets/js/core/components.js"></script>
  <script type="module" src="assets/js/pages/verify-email.js"></script>
</body>
</html>
