<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function() {
    var urlParams = new URLSearchParams(window.location.search);
    var urlLang = urlParams.get('lang');
    var storedLang = localStorage.getItem('sizo-lang');
    var lang = (urlLang && ['en','fr','ar'].includes(urlLang)) ? urlLang : (storedLang && ['en','fr','ar'].includes(storedLang) ? storedLang : 'en');
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  })();
  </script>
  <script>
  (function(){
    var t=localStorage.getItem('sizo-theme')||'dark';
    document.documentElement.setAttribute('data-theme',t);
    if(t==='dark')document.documentElement.classList.add('dark');
  })();
  </script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News & Updates | SIZO Digital Store</title>
  <meta name="description" content="Latest news, updates and announcements from SIZO.">
  <link rel="canonical" href="https://sizo.uk/news.html">
  <link rel="alternate" hreflang="en" href="https://sizo.uk/news.html?lang=en">
  <link rel="alternate" hreflang="fr" href="https://sizo.uk/news.html?lang=fr">
  <link rel="alternate" hreflang="ar" href="https://sizo.uk/news.html?lang=ar">
  <link rel="alternate" hreflang="x-default" href="https://sizo.uk/news.html">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <script defer src="assets/js/vendor/lucide-0.475.0.min.js"></script>
</head>
<body class="font-body">
  <a href="#main-content" class="skip-link" data-i18n="skip_link">Skip to content</a>
  <header id="navbar-mount"></header>

  <main id="main-content" class="mx-auto max-w-4xl px-4 pt-28 pb-16">
    <div class="mb-10 border-b pb-8" style="border-color:var(--border)">
      <p class="font-mono text-xs uppercase tracking-[0.3em]" style="color:var(--cyan)" data-anim="fade-up" data-i18n="nav_news">News</p>
      <h1 class="mt-2 font-display text-4xl font-black" style="color:var(--text)" data-anim="fade-up" data-anim-delay="1" data-i18n="nav_news">News</h1>
      <p class="mt-3 max-w-2xl" style="color:var(--text-secondary)" data-anim="fade-up" data-anim-delay="2" data-i18n="news_subtitle">
        Updates, announcements and what we are working on.
      </p>
    </div>

    <section class="card" style="text-align:center;padding:3rem 2rem" data-anim="fade-up" data-anim-delay="3">
      <i data-lucide="newspaper" class="mx-auto mb-4" style="color:var(--cyan);width:48px;height:48px"></i>
      <h2 class="font-display text-2xl font-bold" style="color:var(--text);margin-bottom:0.75rem" data-i18n="news_coming_soon">We're working on this section. Check back soon.</h2>
      <p style="color:var(--text-secondary);max-width:32rem;margin:0 auto" data-i18n="news_secondary">
        In the meantime, follow our store for flash sales, new arrivals, and platform updates.
      </p>
      <div style="margin-top:2rem">
        <a href="/browse.html" class="btn btn-primary">
          <span data-i18n="nav_browse">Browse</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </a>
      </div>
    </section>
  </main>

  <footer id="footer-mount"></footer>

  <script type="module" src="assets/js/core/components.js"></script>
</body>
</html>
