<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function() {
    var urlParams = new URLSearchParams(window.location.search);
    var urlLang = urlParams.get('lang');
    var storedLang = localStorage.getItem('sizo-lang');
    var lang = (urlLang && ['en','fr','ar'].includes(urlLang)) ? urlLang : (storedLang && ['en','fr','ar'].includes(storedLang) ? storedLang : 'en');
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  })();
  </script>
  <script>
  (function(){
    var t=localStorage.getItem('sizo-theme')||'dark';
    document.documentElement.setAttribute('data-theme',t);
    if(t==='dark')document.documentElement.classList.add('dark');
  })();
  </script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | SIZO Digital Store</title>
  <meta name="description" content="Set a new password for your SIZO account.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Orbitron:wght@700;800;900&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <script defer src="assets/js/vendor/lucide-0.475.0.min.js"></script>
  <!-- Shared Design System -->
</head>
<body class="font-body">
  <a href="#main-content" class="skip-link" data-i18n="skip_link">Skip to content</a>
  <header id="navbar-mount"></header>

  <main id="main-content" class="mx-auto flex min-h-screen max-w-md items-center px-4 py-10 pt-28">
    <div style="border-color:var(--border)" class="w-full border rounded-2xl bg-[var(--surface)] p-8  dark:bg-[var(--surface)]" data-anim="slide-right" data-anim-delay="1">
      <p class="font-mono text-xs uppercase tracking-[0.3em] text-cyan" data-anim="fade-up" data-i18n="reset_subtitle">Secure Reset</p>
      <h1 style="color:var(--text-primary)" class="mt-3 font-display text-3xl font-black  " data-anim="fade-up" data-anim-delay="1" data-i18n="reset_title">RESET PASSWORD</h1>
      <p id="reset-password-copy" class="mt-2 text-[var(--muted)]" data-anim="fade-up" data-anim-delay="2" data-i18n="reset_description">Choose a new password for your SIZO account.</p>

      <form id="reset-password-form" class="mt-6 space-y-4">
        <div>
          <label for="reset-password" class="required" data-i18n="field_new_password_label">New Password</label>
          <input id="reset-password" type="password" required minlength="8" autocomplete="new-password" class="input-cyber" placeholder="Minimum 8 characters" data-i18n-placeholder="reset_password_min_placeholder">
          <span id="reset-password-error" class="field-error" hidden></span>
        </div>
        <div>
          <label for="reset-password-confirm" class="required" data-i18n="field_confirm_password_label">Confirm Password</label>
          <input id="reset-password-confirm" type="password" required minlength="8" autocomplete="new-password" class="input-cyber" placeholder="Repeat your password" data-i18n-placeholder="reset_password_repeat_placeholder">
          <span id="reset-password-confirm-error" class="field-error" hidden></span>
        </div>
        <div id="reset-password-turnstile" class="hidden"></div>
        <button id="reset-password-submit" type="submit" class="btn-cyber w-full bg-cyan py-3 font-display font-bold text-void" data-anim="scale-in" data-anim-delay="3" data-i18n="btn_update_password">UPDATE PASSWORD</button>
      </form>

      <div id="reset-password-status" class="mt-5 hidden border p-4 text-sm"></div>

      <p class="mt-6 text-center text-sm text-[var(--muted)]"><span data-i18n="reset_need_new">Need a new email?</span> <a href="forgot-password.html" class="text-cyan" data-i18n="reset_request_another">Request another reset</a></p>
    </div>
  </main>

  <footer id="footer-mount"></footer>

  <!-- Shared Components -->
  <script type="module" src="assets/js/core/components.js"></script>
  <!-- Page script -->
  <script type="module" src="assets/js/pages/reset-password.js"></script>
</body>
</html>
