    <!-- Browse Header -->
    <div class="browse-header">
      <div class="browse-header__inner">
        <div class="browse-header__left">
          <div class="browse-header__meta">
            <h1 class="browse-header__title" data-anim="fade-up" data-i18n="browse_title">Store</h1>

          <p class="browse-header__scope" data-i18n="browse_scope">Gift cards, top-ups, game keys, and deals ready for instant checkout.</p>
        </div>
        <div class="browse-header__right">
          <div class="search-wrap">
            <span class="search-wrap__label" aria-hidden="true" data-i18n="aria_search_label">Search</span>

          </div>
          <label for="sort-select" class="sr-only" data-i18n="sr_sort">Sort</label>
          <select id="sort-select" class="sort-select">
            <option value="popular" data-i18n="sort_popular">Popular</option>
            <option value="discount" data-i18n="sort_discount">Biggest Discount</option>
            <option value="new" data-i18n="sort_new">Newest</option>
            <option value="price-low" data-i18n="sort_price_low">Price: Low → High</option>
            <option value="price-high" data-i18n="sort_price_high">Price: High → Low</option>
            <option value="rating" data-i18n="sort_rating">Top Rated</option>
          </select>
          <button id="filter-toggle-btn" class="filter-toggle" aria-expanded="false" aria-controls="filter-drawer">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="6" y2="6"/><line x1="7" x2="17" y1="12" y2="12"/><line x1="10" x2="14" y1="18" y2="18"/></svg>
            Filters

          <div class="view-toggles">
            <button id="grid-view" aria-label="Grid view" data-i18n-aria-label="aria_grid_view" aria-pressed="true" class="view-btn active">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>

          </div>
        </div>
      </div>
    </div>

    <!-- Type Tabs -->
    <div class="type-tabs">

          Top-Ups
        </button>
        <button role="tab" class="type-tab" data-quick-filter="game-keys" aria-selected="false" tabindex="-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/></svg>
          Game Keys

          Deals
        </button>
        <button role="tab" class="type-tab" data-quick-filter="under-1000" aria-selected="false" tabindex="-1" data-i18n="tab_under_1000">Under 1000 DZD</button>
      </nav>
    </div>

    <!-- Active Filters Strip -->
    <div class="container-main"><div id="active-filters" class="active-filters"></div></div>

    <!-- Collapsible Filter Drawer -->
    <div id="filter-drawer" class="filter-drawer" role="region" aria-label="Filters" data-anim="slide-left" data-anim-delay="1">

        <div class="filter-drawer__head">

        </div>
        <!-- Category -->
        <div class="filter-group">
          <p class="filter-group__label" data-i18n="filter_category">Category</p>
          <div id="category-filters" class="filter-group__options">
            <label class="filter-option"><input type="radio" name="category-filter" value="" checked> All Categories</label>
          </div>
        </div>
        <!-- Platform -->
        <div class="filter-group">
          <p class="filter-group__label" data-i18n="filter_platform">Platform</p>
          <div id="platform-filters" class="filter-group__options">
            <!-- Fallback — replaced by API if available -->
            <label class="filter-option"><input type="checkbox" name="platform-filter" value="Steam"> Steam</label>
            <label class="filter-option"><input type="checkbox" name="platform-filter" value="PlayStation"> PlayStation</label>
            <label class="filter-option"><input type="checkbox" name="platform-filter" value="Xbox"> Xbox</label>
            <label class="filter-option"><input type="checkbox" name="platform-filter" value="Nintendo"> Nintendo</label>
            <label class="filter-option"><input type="checkbox" name="platform-filter" value="PC"> PC</label>
          </div>
        </div>
        <!-- Region -->
        <div class="filter-group">
          <p class="filter-group__label"><span data-i18n="product_region">Region</span> </p>
          <div id="region-filters" class="filter-group__options">
            <!-- Fallback — replaced by API if available -->
            <label class="filter-option"><input type="checkbox" name="region-filter" value="GLOBAL"> GLOBAL</label>
            <label class="filter-option"><input type="checkbox" name="region-filter" value="EU"> EU</label>
            <label class="filter-option"><input type="checkbox" name="region-filter" value="US"> US</label>
            <label class="filter-option"><input type="checkbox" name="region-filter" value="MENA"> MENA</label>
          </div>
        </div>
        <!-- Price Range -->
        <div class="filter-group">
          <p class="filter-group__label" data-i18n="filter_price_range">Price Range</p>
          <div class="filter-group__options" data-price-group>
            <div class="price-inputs">
              <label for="price-min" class="sr-only" data-i18n="label_min_price">Min price</label>
              <input type="number" id="price-min" placeholder="0" class="price-input" min="0">
              <span class="price-inputs__separator">-</span>
              <label for="price-max" class="sr-only" data-i18n="label_max_price">Max price</label>
              <input type="number" id="price-max" placeholder="10000" class="price-input" min="0">
            </div>
            <label for="price-range" class="sr-only" data-i18n="label_price_range">Price range</label>
            <input type="range" id="price-range" class="price-slider" min="0" max="10000" value="10000">
            <span class="price-slider-hint" data-i18n="price_slider_hint">Slide to cap max price</span>
            <p id="price-error" class="price-error" role="alert" aria-live="assertive" hidden></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Product Grid -->
